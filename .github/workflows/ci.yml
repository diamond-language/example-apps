name: test

on:
  # Changes reach main through a pull request rebased onto it, so a run on the merge
  # commit would repeat the run on that exact tree. workflow_dispatch checks main by hand.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stash:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Diamond is C23, which needs the compiler in Ubuntu 26.04.
    container:
      image: ubuntu:26.04
      options: --init
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y gcc make git ca-certificates diffutils findutils \
            libssl-dev libsqlite3-dev libpq-dev zlib1g-dev libmariadb-dev libcrypt-dev \
            sqlite3 python3 curl gzip openssl
      - uses: actions/checkout@v7
        with:
          path: example-apps
          fetch-depth: 1
      - uses: actions/checkout@v7
        with:
          repository: diamond-language/diamond
          path: diamond
          fetch-depth: 1
      - name: Build Diamond and facet
        run: make -C diamond release facet
      - name: Install cuts and compile views
        working-directory: example-apps/stash
        run: |
          export PATH="$GITHUB_WORKSPACE/diamond/build:$PATH"
          facet install
          ./compile_views.sh
      - name: Run the tests
        working-directory: example-apps/stash
        run: |
          export PATH="$GITHUB_WORKSPACE/diamond/build:$PATH"
          python3 test/app_test.py

  # The terminal apps: each app's test.sh runs its minitest files.
  cli-tcp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ubuntu:26.04
      options: --init
    strategy:
      fail-fast: false
      matrix:
        app: [tasks, kvd]
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y gcc make git ca-certificates diffutils findutils \
            libssl-dev libsqlite3-dev libpq-dev zlib1g-dev libmariadb-dev libcrypt-dev curl gzip
      - uses: actions/checkout@v7
        with:
          path: example-apps
          fetch-depth: 1
      - uses: actions/checkout@v7
        with:
          repository: diamond-language/diamond
          path: diamond
          fetch-depth: 1
      - name: Build Diamond and facet
        run: make -C diamond release facet
      - name: Install cuts and run the tests
        working-directory: example-apps/${{ matrix.app }}
        run: |
          export PATH="$GITHUB_WORKSPACE/diamond/build:$PATH"
          facet install
          bash test.sh
